<!DOCTYPE html>
<html>

<head>

<title>Edit Lesson</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<section class="section">

<div class="container">

<div class="terminal-box">

<h1>Edit Lesson</h1>

<form method="POST">

<input
type="text"
name="title"
value="{{ lesson.title }}"
required>


<textarea
name="caption"
required>{{ lesson.caption }}</textarea>


<input
type="number"
step="0.01"
name="price"
value="{{ lesson.price }}"
required>


<input
type="number"
name="order"
value="{{ lesson.order }}"
required>


<button class="btn" type="submit">
Save Changes
</button>

</form>

</div>

</div>

</section>

</body>

</html>
