<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | FD Khan Academy</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header>

<div class="logo">
FD KHAN ACADEMY
</div>


<nav>

<a href="/">Home</a>
<a href="{{ url_for('auth.login') }}">Login</a>

</nav>

</header>



<section class="section">

<div class="container">


<div class="terminal-box">


<h1>
Create Account
</h1>



<form method="POST">


<input

type="text"

name="first_name"

placeholder="First Name"

required>



<input

type="text"

name="last_name"

placeholder="Last Name"

required>



<input

type="email"

name="email"

placeholder="Email Address"

required>



<input

type="password"

name="password"

placeholder="Password"

required>



<button

class="btn"

type="submit">

Register

</button>


</form>



<p>

Already have an account?

<a href="{{ url_for('auth.login') }}">
Login here
</a>

</p>


</div>


</div>

</section>


<footer>

© 2026 FD Khan Academy

</footer>


</body>

</html>
