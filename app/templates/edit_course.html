<!DOCTYPE html>
<html>

<head>

<title>Edit Course</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header>

<div class="logo">
FD KHAN ACADEMY
</div>

</header>



<section class="section">

<div class="container">


<div class="terminal-box">


<h1>Edit Course</h1>


<form method="POST">


<input
type="text"
name="title"
value="{{ course.title }}"
required>


<textarea
name="description">{{ course.description }}</textarea>


<input
type="text"
name="grade"
value="{{ course.grade }}">


<input
type="text"
name="subject"
value="{{ course.subject }}">


<input
type="number"
step="0.01"
name="price"
value="{{ course.price }}">


<button class="btn"
type="submit">

Save Changes

</button>


</form>


</div>


</div>


</section>


</body>

</html>
