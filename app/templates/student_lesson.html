<!DOCTYPE html>
<html>

<head>

<title>Student Lesson | FD Khan Academy</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">


<script src="https://www.paypal.com/sdk/js?client-id={{ setting.paypal_client_id if setting else config.PAYPAL_CLIENT_ID }}&currency=USD"></script>

</head>


<body>


<header>

<div class="logo">
FD KHAN ACADEMY
</div>


<nav>

<a href="/">
Home
</a>


<a href="{{ url_for('booking.booking_page') }}">
Book Lesson
</a>


<a href="{{ url_for('student.courses') }}">
Browse Courses
</a>


<a href="{{ url_for('auth.change_password') }}">
Change Password
</a>


<a href="{{ url_for('auth.logout') }}">
Logout
</a>

</nav>

</header>



<section class="section">


<div class="container">


<h1>
Welcome back, {{ current_user.first_name }} 👋
</h1>



<div class="terminal-box">


<h2>
🎬 Lesson
</h2>


{% if video %}

<h3>
{{ video.title }}
</h3>


<p>
{{ video.caption }}
</p>


<video width="100%" controls>

<source src="{{ url_for('static', filename='uploads/' + video.video_file) }}">

Your browser does not support video playback.

</video>


{% else %}

<p>
Lesson not found.
</p>

{% endif %}



</div>


</div>


</section>




<footer>

© 2026 FD Khan Academy

</footer>


</body>

</html>
