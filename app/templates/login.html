{% extends "base.html" %}

{% block title %}
Login | FD Khan Academy
{% endblock %}

{% block content %}

<section class="section">

<div class="container">

<div class="terminal-box">

<h1>
Login
</h1>

<form method="POST">

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button
class="btn"
type="submit">

Login

</button>

<p style="margin-top:15px;">

<a href="{{ url_for('auth.forgot_password') }}">
Forgot Password?
</a>

</p>

</form>

<p>

Don't have an account?

<a href="{{ url_for('auth.register') }}">
Register here
</a>

</p>

</div>

</div>

</section>

{% endblock %}
